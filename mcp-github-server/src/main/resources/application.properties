spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# Paste your GitHub Personal Access Token here
# Generate at: GitHub -> Settings -> Developer Settings -> Personal access tokens -> Tokens (classic)
# Required scopes: repo, read:user, notifications
github.token=PASTE_YOUR_PAT_HERE

# GitHub API base URL (rarely needs changing)
github.api.base-url=https://api.github.com